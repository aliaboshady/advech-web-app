<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Advech</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Keep in sync with src/lib/theme.ts (dark by default) and the canvas colours in DESIGN.md.
      (() => {
        const savedTheme = localStorage.getItem('theme');
        const isDark = savedTheme ? savedTheme === 'dark' : true;

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #f6f6f7;
        z-index: 99999;
      }

      .dark #app-splash {
        background: #08090a;
      }

      #app-splash-logo {
        width: clamp(180px, 18vmin, 300px);
        height: auto;
      }

      #app-splash-spinner {
        width: clamp(32px, 6vmin, 56px);
        height: clamp(32px, 6vmin, 56px);
        border: clamp(3px, 0.5vmin, 5px) solid #08090a1a;
        border-top-color: #ff5001;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }

      .dark #app-splash-spinner {
        border-color: #f7f8f81a;
        border-top-color: #ff5001;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app-splash">
      <img id="app-splash-logo" src="/advech-lockup-orange.svg" alt="Advech" />

      <div id="app-splash-spinner"></div>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
