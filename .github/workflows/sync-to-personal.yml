
name: Sync to Personal Repository

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout organization repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to personal repository
        env:
          PERSONAL_REPO_TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
        run: |
          git remote add personal \
            "https://x-access-token:${PERSONAL_REPO_TOKEN}@github.com/aliaboshady/advech-web-app.git"

          git push personal HEAD:develop
